name: Azure OIDC Test

on:
  workflow_dispatch:
  push:
    branches:
      - azure-devops-project
    paths:
      - ".github/workflows/azure-oidc-test.yml"

permissions:
  id-token: write
  contents: read

jobs:
  oidc-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure login
        run: |
          echo "Azure OIDC login successful"
          az account show \
            --query "{Subscription:name,Tenant:tenantId}" \
            --output table

      - name: Verify ACR
        run: |
          az acr show \
            --name "${{ vars.ACR_NAME }}" \
            --query "{Name:name,LoginServer:loginServer}" \
            --output table
