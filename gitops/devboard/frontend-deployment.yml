apiVersion: apps/v1
kind: Deployment
metadata:
  name: devboard-frontend-deployment
  namespace: devboard
  labels:
    app: devboard-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devboard-frontend
  template:
    metadata:
      labels:
        app: devboard-frontend
    spec:
      containers:
      - name: devboard-frontend
        image: acrdevboard8jtn7p.azurecr.io/devboard-frontend:sha-2a74a097cc7e1ea719b74f0c514f6c37a04a048d
        ports:
        - containerPort: 8080
        resources:
          requests: # min needed
            cpu: 50m
            memory: 64Mi
          limits: # max usable
            cpu: 250m
            memory: 128Mi



