apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: devboard-backend-rollout
  namespace: devboard
  labels:
    app: devboard-backend-rollout

spec:
  replicas: 2

  selector:
    matchLabels:
      app: devboard-backend-rollout

  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
      steps:
        - setWeight: 50
        - pause:
            duration: 30s
        - setWeight: 100

  template:
    metadata:
      labels:
        app: devboard-backend-rollout
        azure.workload.identity/use: "true"

    spec:
      serviceAccountName: devboard-workload-sa

      containers:
        - name: devboard-backend
          image: acrdevboard8jtn7p.azurecr.io/devboard-backend:sha-2a74a097cc7e1ea719b74f0c514f6c37a04a048d

          ports:
            - containerPort: 8080

          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: devboard-configmap
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devboard-kv-secrets
                  key: POSTGRES_PASSWORD

            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: devboard-configmap
                  key: POSTGRES_DB

            - name: POSTGRES_URL
              value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)?sslmode=disable

            - name: PORT
              value: "8080"

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5

          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true

      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: devboard-keyvault
