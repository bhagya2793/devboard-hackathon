apiVersion: apps/v1
kind: Deployment

metadata:
  name: devboard-frontend-deployment
  namespace: devboard
  labels:
    app: devboard-frontend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: devboard-frontend

  template:
    metadata:
      labels:
        app: devboard-frontend

    spec:
      containers:
        - name: devboard-frontend
          image: trainwithshubham/devboard-frontend:latest

          ports:
            - containerPort: 4173

          resources:
            requests:
              cpu: 100m
              memory: 64Mi

            limits:
              cpu: 500m
              memory: 256Mi

          readinessProbe:
            httpGet:
              path: /
              port: 4173
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 4173
            initialDelaySeconds: 20
            periodSeconds: 10



