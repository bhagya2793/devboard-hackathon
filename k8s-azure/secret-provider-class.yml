apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: devboard-keyvault
  namespace: devboard
spec:
  provider: azure

  secretObjects:
    - secretName: devboard-kv-secrets
      type: Opaque
      data:
        - objectName: postgres-password
          key: POSTGRES_PASSWORD

  parameters:
    usePodIdentity: "false"
    clientID: "19ec256f-0340-4038-b34f-18e14376929b"
    keyvaultName: "kv-devboard-8jtn7p"
    tenantId: "ff6d42db-ffcc-42aa-9992-59beca537ebb"

    objects: |
      array:
        - |
          objectName: postgres-password
          objectType: secret
          objectVersion: ""
